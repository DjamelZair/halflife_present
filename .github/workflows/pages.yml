name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "data/cyp_reference.csv"
      - ".github/workflows/pages.yml"
  workflow_call: {}  # the daily job calls this after it has saved the new brief
  workflow_dispatch: {}  # lets me redeploy by hand

permissions:
  contents: read
  pages: write
  id-token: write  # deploy-pages proves who it is with this

# a newer deploy replaces one still waiting, the newest page is the only one I care about
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # called from the daily job this has to include the brief it just saved

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build the site
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
