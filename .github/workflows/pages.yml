name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "halflife/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_call: {}  # the daily job calls this after it has saved the new brief
  workflow_dispatch: {}  # lets me redeploy by hand

permissions:
  contents: read
  pages: write
  id-token: write  # deploy-pages proves who it is with this

# a newer deploy replaces one still waiting, the newest page is the only one I care about
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # failing tests can never reach the site, whichever way a deploy gets started
  test:
    uses: ./.github/workflows/tests.yml
    with:
      ref: main  # called from the daily job this has to include the brief it just saved

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}  # the commit that passed, not whatever main is by now

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build the site
        env:
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub answers a 500 now and then. three tries, a few minutes apart, only the last one may fail the job
      - id: try1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.try1.outcome == 'failure'
        run: sleep 180

      - id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.try2.outcome == 'failure'
        run: sleep 180

      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
