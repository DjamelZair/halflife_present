name: Daily brief

on:
  schedule:
    # GitHub runs cron in UTC and can start hours late, I have seen 10 hours. So the job runs the evening
    # before and only schedules the push, ntfy delivers it at 07:30 Dutch time, summer and winter alike.
    # Not on the hour on purpose, GitHub delays jobs that start at :00 when it is busy.
    - cron: "17 18 * * *"
  workflow_dispatch: {}  # lets me press "Run workflow" by hand to test

permissions:
  contents: write  # needed to commit the new outputs folder back to the repo

jobs:
  brief:
    # pinned, so a new Ubuntu image never changes the morning run without me noticing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the morning brief
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ secrets.APP_URL }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional, empty means plain mode
        run: python run_daily.py

      - name: Save outputs to the repo
        run: |
          git config user.name "halflife-bot"
          git config user.email "halflife-bot@users.noreply.github.com"
          git add outputs/
          git commit -m "Brief for $(ls outputs | grep '^2' | tail -1)" || echo "nothing new"
          git pull --rebase
          git push

  # the push points at pictures on the site, so the site always follows the brief
  deploy:
    needs: brief
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
