name: Daily brief

on:
  schedule:
    # GitHub runs cron in UTC and can start hours late, I have seen 10 hours. So the job runs the evening
    # before and only schedules the push, ntfy delivers it at 07:30 Dutch time, summer and winter alike.
    # Not on the hour on purpose, GitHub delays jobs that start at :00 when it is busy.
    - cron: "17 18 * * *"
  workflow_dispatch: {}  # lets me press "Run workflow" by hand to test

permissions:
  contents: write  # needed to commit the new outputs folder back to the repo
  actions: write  # needed to keep the schedule switched on, see below

jobs:
  brief:
    # pinned, so a new Ubuntu image never changes the morning run without me noticing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the morning brief
        env:
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
          APP_URL: ${{ secrets.APP_URL }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}  # optional, empty means the web search is skipped
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional, empty means plain mode
        run: python run_daily.py --push-later

      - name: Save outputs to the repo
        run: |
          git config user.name "halflife-bot"
          git config user.email "halflife-bot@users.noreply.github.com"
          git add outputs/
          git commit -m "Brief for $(ls outputs | grep '^2' | tail -1)" || echo "nothing new"
          git pull --rebase
          git push

      # GitHub switches schedules off after 60 days without "repository activity" and does not say whether
      # bot commits count, so every run also switches them on. the ntfy alarm in admin.py is the real safety net
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable night-check.yml --repo "$GITHUB_REPOSITORY"

  # the push points at pictures on the site, so the site always follows the brief
  deploy:
    needs: brief
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  # after the deploy, with its retries, so today's molecule image can be there. whatever happened to the deploy (three
  # failed tries, failing tests, cancelled by a newer deploy) the push still goes out, then without the image. always()
  # and not !cancelled(), so a cancelled deploy can't take the push down with it
  push:
    needs: [brief, deploy]
    if: ${{ always() && needs.brief.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # holds the brief the job above just saved
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Queue the push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python scripts/send_push.py

  # a run this late started after the last night check, so nothing else would tell me its deploy failed.
  # site_check.py only alerts after 06:00 UTC, an ordinary evening stays quiet and the night check takes it from there
  late-check:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
        run: python scripts/site_check.py --alert --evening-done

  # no brief or no push. a failed deploy does not alert here, the night check retries it and alerts if that fails too
  alert:
    needs: [brief, push]
    if: ${{ always() && (needs.brief.result == 'failure' || needs.push.result == 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Tell me
        env:
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ADMIN_NTFY_TOPIC" ]; then echo "No admin topic set"; exit 0; fi
          curl -fsS -H "Title: Halflife: the evening run failed" -H "Priority: high" -H "Click: $RUN_URL" \
            -d "Open the run to see what broke. The push may not go out tomorrow." "https://ntfy.sh/$ADMIN_NTFY_TOPIC" > /dev/null
