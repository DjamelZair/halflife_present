name: Night check

on:
  schedule:
    # if the evening deploy failed three times this catches it. two tries, from the 06:00 one on a stale site always alerts
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch: {}

permissions:
  actions: read  # to see whether the evening run is still queued or running
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.site.outputs.stale }}
      redeploy: ${{ steps.site.outputs.redeploy }}
      final: ${{ steps.site.outputs.final }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/site_check.py

  # not while the evening run is busy, this deploy would cancel the one in that run
  redeploy:
    needs: check
    if: needs.check.outputs.redeploy == 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  # after a redeploy, and always at the last check, also when there was nothing to redeploy. site_check.py alerts from
  # 06:00 UTC on when the site is still stale, and says why. always(), a skipped redeploy must not stop this
  verify:
    needs: [check, redeploy]
    if: ${{ always() && needs.check.outputs.stale == 'true' && (needs.check.outputs.redeploy == 'true' || needs.check.outputs.final == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/site_check.py --alert --wait 10
