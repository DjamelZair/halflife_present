name: Night check

on:
  schedule:
    # if the evening deploy failed three times this catches it. two tries, only from the last one on it may alert me
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch: {}

permissions:
  actions: read  # to see whether the evening run is still queued or running
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.site.outputs.stale }}
      redeploy: ${{ steps.site.outputs.redeploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/site_check.py

  # not while the evening run is busy, this deploy would cancel the one in that run
  redeploy:
    needs: check
    if: needs.check.outputs.redeploy == 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  # site_check.py decides whether this alerts: still stale, evening run finished, and after the last check of the night
  verify:
    needs: [check, redeploy]
    if: ${{ !cancelled() && needs.check.outputs.redeploy == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_NTFY_TOPIC: ${{ secrets.ADMIN_NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/site_check.py --alert --wait 10
